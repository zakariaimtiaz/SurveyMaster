#############################################################################################
#                    Hot deploy / development-only settings                                 #
#                    Active with: --spring.profiles.active=dev                              #
#############################################################################################
# Recompile changed JSPs automatically instead of serving stale pages
server.servlet.jsp.init-parameters.development=true
server.servlet.jsp.init-parameters.check-interval=2
# Never cache static resources so browser picks up edits on refresh
spring.resources.cache.period=0
spring.resources.chain.cache=false
spring.resources.chain.strategy.content.enabled=false
#############################################################################################
